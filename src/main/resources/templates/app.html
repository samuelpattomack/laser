<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Agenda de reservas • Cortadora Laser — FAU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --primary:#e50914;
      --primary-dark:#a3070f;
      --bg:#ffffff;
      --text:#222;
      --muted:#6b7280;
      --line:#e5e7eb;
      --card:#fff;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --soft:#f8fafc;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Poppins", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display:flex; justify-content:center;
      padding:24px 14px;
    }

    .container{
      width:min(960px, 96vw);
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow: var(--shadow);
      padding:22px 22px 16px;
    }

    /* topo */
    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; margin-bottom:14px;
    }
    .brand{ display:flex; align-items:center; gap:10px; }
    .logo{
      width:48px; height:48px; border-radius:999px; background:var(--primary);
      color:#fff; display:grid; place-items:center; font-weight:800; font-size:20px;
      box-shadow:0 8px 18px rgba(229,9,20,.25);
      user-select:none;
    }
    .brand h1{ font-size:18px; margin:0; }
    nav a, nav form button{
      color:var(--primary); text-decoration:none; font-weight:600; margin-left:16px; cursor:pointer;
    }
    nav a:hover, nav form button:hover{ color:var(--primary-dark); }
    nav form{ display:inline }

    /* ações */
    .actions{
      display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;
      margin:10px 0 18px 0;
    }
    .actions a{
      display:block; text-align:center; padding:12px 14px; border-radius:10px;
      color:#fff; background:var(--primary); text-decoration:none; font-weight:600;
      border:1px solid var(--primary);
      box-shadow:0 12px 24px rgba(229,9,20,.16);
    }
    .actions a:hover{ filter:brightness(1.05) }
    @media (max-width:700px){ .actions{ grid-template-columns:1fr; } }

    /* layout principal: calendário + painel */
    .grid{
      display:grid; grid-template-columns: 1.4fr .9fr; gap:16px;
    }
    @media (max-width:900px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
    }

    /* calendário */
    .cal-head{
      display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
    }
    .cal-head h2{ margin:0; font-size:18px; }
    .cal-nav{ display:flex; gap:8px; }
    .btn{
      border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; cursor:pointer;
      font-weight:600;
    }
    .btn:hover{ border-color:#d1d5db }

    .cal-grid{
      display:grid; grid-template-columns: repeat(7, 1fr);
      border-top:1px solid var(--line);
      border-left:1px solid var(--line);
    }
    .dow{
      text-align:center; font-size:12px; color:var(--muted); padding:8px 0; background:var(--soft);
      border-right:1px solid var(--line); border-bottom:1px solid var(--line);
      font-weight:600;
    }
    .day{
      min-height:88px; padding:8px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
      position:relative; background:#fff; cursor:pointer;
    }
    .day.other{ background:#fafafa; color:#9ca3af }
    .day:hover{ background:#fdf2f2 }
    .day .num{ font-weight:700; font-size:13px; }
    .badge{
      position:absolute; right:8px; top:8px; width:8px; height:8px; background:var(--primary); border-radius:999px;
      box-shadow:0 0 0 2px #fff;
    }
    .today{
      outline:2px solid var(--primary); outline-offset:-2px; border-radius:8px;
    }

    /* painel de reservas */
    .panel h3{ margin:0 0 8px 0; font-size:16px; }
    .empty{ padding:10px; border:1px dashed var(--line); border-radius:10px; background:#fff; color:var(--muted); }
    .item{
      border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; background:#fff;
    }
    .item b{ color:#111 }
    .item small{ color:var(--muted) }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="brand">
        <div class="logo">M</div>
        <h1>Cortadora Laser — FAU</h1>
      </div>
      <nav>
        <a href="/app">Home</a>
        <form action="/logout" method="post" style="display:inline">
          <button type="submit" style="all:unset;cursor:pointer;color:#e50914;font-weight:600">Sair</button>
        </form>
      </nav>
    </div>

    <!-- Ações rápidas -->
    <div class="actions">
      <a href="/uc01">Agendar</a>
      <a href="/uc02">Cancelar</a>
      <a href="/uc03">Incluir Suplente</a>
    </div>

    <!-- Calendário + painel -->
    <div class="grid">
      <section class="card">
        <div class="cal-head">
          <h2 id="cal-title">Carregando…</h2>
          <div class="cal-nav">
            <button class="btn" id="prev-month">&lt; Anterior</button>
            <button class="btn" id="today-btn">Hoje</button>
            <button class="btn" id="next-month">Próximo &gt;</button>
          </div>
        </div>

        <!-- nomes dos dias -->
        <div class="cal-grid" id="cal-grid">
          <div class="dow">Dom</div><div class="dow">Seg</div><div class="dow">Ter</div>
          <div class="dow">Qua</div><div class="dow">Qui</div><div class="dow">Sex</div><div class="dow">Sáb</div>
          <!-- dias serão inseridos por JS -->
        </div>
      </section>

      <aside class="card panel">
        <h3 id="panel-title">Reservas do dia</h3>
        <div id="panel-list" class="empty">Clique em um dia do calendário para ver as reservas.</div>
      </aside>
    </div>
  </div>

  <!-- Evita o Thymeleaf processar ${...} do JS -->
  <script th:inline="none">
    /* =======================
       Geração de reservas fake
       ======================= */
    const machines = ["laser1","laser2"];
    // cria algumas reservas nos próximos 20 dias para parecer "vivo"
    const FAKE = [];
    (function seed(){
      const today = new Date();
      for(let i=0;i<16;i++){
        const d = new Date(today);
        d.setDate(today.getDate() + (i*1 + (i%3===0?0:Math.floor(Math.random()*2)))); // espalha
        // 1 a 3 reservas por dia
        const qty = 1 + Math.floor(Math.random()*3);
        for(let j=0;j<qty;j++){
          const startHour = 9 + Math.floor(Math.random()*8); // 9h às 16h
          const startMin  = [0,15,30,45][Math.floor(Math.random()*4)];
          const end = new Date(d);
          end.setHours(startHour+1, startMin);
          FAKE.push({
            date: new Date(d.getFullYear(), d.getMonth(), d.getDate()),
            start: `${String(startHour).padStart(2,'0')}:${String(startMin).padStart(2,'0')}`,
            end:   `${String((startHour+1)).padStart(2,'0')}:${String(startMin).padStart(2,'0')}`,
            machine: machines[Math.floor(Math.random()*machines.length)],
            owner: Math.random()<.4 ? "TFG" : "Aluno"
          });
        }
      }
    })();

    function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` }

    // agrupa por dia para lookup rápido
    const RES_BY_DAY = {};
    for(const r of FAKE){
      const k = ymd(r.date);
      (RES_BY_DAY[k] ||= []).push(r);
    }

    /* =======================
       Calendário
       ======================= */
    const calTitle = document.getElementById('cal-title');
    const grid = document.getElementById('cal-grid');
    const panelTitle = document.getElementById('panel-title');
    const panelList  = document.getElementById('panel-list');

    let view = new Date(); // mês em exibição

    function render(){
      // limpa os dias antigos (mantém a linha dos DOW no começo)
      while(grid.children.length > 7) grid.removeChild(grid.lastChild);

      const year = view.getFullYear();
      const month = view.getMonth();

      // título
      const monthNames = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
      calTitle.textContent = `${monthNames[month].charAt(0).toUpperCase()+monthNames[month].slice(1)} ${year}`;

      // primeiro dia do mês (domingo = 0)
      const first = new Date(year, month, 1);
      const startDay = first.getDay(); // deslocamento

      // quantos dias no mês atual e anterior
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const daysPrev = new Date(year, month, 0).getDate();

      // preenchimento inicial (dias do mês anterior)
      for(let i=startDay-1; i>=0; i--){
        const num = daysPrev - i;
        const cell = createDay(num, new Date(year, month-1, num), true);
        grid.appendChild(cell);
      }

      // dias do mês atual
      for(let d=1; d<=daysInMonth; d++){
        const cell = createDay(d, new Date(year, month, d), false);
        grid.appendChild(cell);
      }

      // completar grade até múltiplo de 7
      const totalCells = grid.children.length;
      const need = Math.ceil(totalCells/7)*7 - totalCells;
      for(let d=1; d<=need; d++){
        const cell = createDay(d, new Date(year, month+1, d), true);
        grid.appendChild(cell);
      }
    }

    function createDay(num, dateObj, isOther){
      const el = document.createElement('div');
      el.className = 'day' + (isOther ? ' other': '');
      const numEl = document.createElement('div');
      numEl.className = 'num';
      numEl.textContent = num;
      el.appendChild(numEl);

      const key = ymd(dateObj);
      if(RES_BY_DAY[key]?.length){
        const dot = document.createElement('span');
        dot.className = 'badge';
        el.appendChild(dot);
      }

      // marca hoje
      const now = new Date();
      if(dateObj.getFullYear()===now.getFullYear() && dateObj.getMonth()===now.getMonth() && dateObj.getDate()===now.getDate()){
        el.classList.add('today');
      }

      el.addEventListener('click', () => openDay(dateObj));
      return el;
    }

    function openDay(dateObj){
      const key = ymd(dateObj);
      const list = RES_BY_DAY[key] || [];
      const pretty = key.split('-').reverse().join('/'); // dd/mm/aaaa
      panelTitle.textContent = `Reservas de ${pretty}`;

      if(!list.length){
        panelList.className = 'empty';
        panelList.textContent = 'Nenhuma reserva para este dia.';
        return;
      }

      panelList.className = '';
      panelList.innerHTML = list
        .sort((a,b)=>a.start.localeCompare(b.start))
        .map(r => `
          <div class="item">
            <b>${r.start}–${r.end}</b> • <b>${r.machine.toUpperCase()}</b><br>
            <small>Responsável: ${r.owner}</small>
          </div>
        `).join('');
    }

    // navegação
    document.getElementById('prev-month').addEventListener('click', () => { view.setMonth(view.getMonth()-1); render(); });
    document.getElementById('next-month').addEventListener('click', () => { view.setMonth(view.getMonth()+1); render(); });
    document.getElementById('today-btn').addEventListener('click', () => { view = new Date(); render(); openDay(new Date()); });

    // boot
    render();
    openDay(new Date());
  </script>
</body>
</html>
