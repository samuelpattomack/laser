<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FAU Mackenzie</title>

  <style>
    :root{
      --primary:#e50914;     /* vermelho FAU */
      --primary-dark:#a3070f;
      --bg:#ffffff;          /* fundo branco */
      --text:#222222;        /* texto principal */
      --muted:#6b7280;       /* cinza para legendas */
      --card:#ffffff;        /* card branco */
      --line:#e5e7eb;        /* borda clara */
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
      display:grid;
      place-items:center;
      padding:32px 16px;
    }

    .card{
      width:min(420px, 92vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:28px 26px 22px;
    }

    .logo{
      width:70px;height:70px;
      border-radius:999px;
      display:grid;place-items:center;
      margin:4px auto 14px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      font-size:32px;
      letter-spacing:.01em;
      box-shadow:0 14px 26px rgba(229,9,20,.25);
      user-select:none;
    }

    h1{
      font-size:22px;
      margin:6px 0 18px 0;
      text-align:center;
      font-weight:700;
    }

    label{
      display:block;
      font-size:12px;
      letter-spacing:.02em;
      color:var(--muted);
      margin:12px 0 6px;
    }

    input{
      width:100%;
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      outline:none;
      border-radius:10px;
      padding:12px 14px;
      font-size:15px;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(229,9,20,.18);
    }

    .row{
      display:flex;align-items:center;justify-content:space-between;
      margin-top:10px;
    }
    .link{
      color:var(--primary);
      text-decoration:none;
      font-size:12px;
      font-weight:600;
    }
    .link:hover{color:var(--primary-dark)}

    .btn{
      width:100%;
      margin-top:16px;
      background:var(--primary);
      color:#fff;
      border:1px solid var(--primary);
      border-radius:12px;
      padding:12px 14px;
      font-weight:700;
      letter-spacing:.01em;
      cursor:pointer;
      box-shadow:0 12px 24px rgba(229,9,20,.25);
      transition:filter .15s, transform .02s;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:translateY(1px)}

    .msg{
      margin-top:12px;
      font-size:13px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid;
      background:#fff;
    }
    .msg.error{
      color:#991b1b;
      border-color:#fecaca;
      background:#fee2e2;
    }
    .msg.ok{
      color:#065f46;
      border-color:#bbf7d0;
      background:#ecfdf5;
    }

    .footer{
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo">M</div>
    <h1>Bem vindo</h1>

    <!-- Form de login do Spring Security -->
    <form method="post" action="/login">
      <label for="username">Email</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <!-- CSRF só se existir no modelo (evita erro 500 quando CSRF está desabilitado) -->
      <input th:if="${_csrf != null}"
             type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="row">
        <span></span>
        <a class="link" href="#" onclick="return false;">Esqueceu a senha?</a>
      </div>

      <button class="btn" type="submit">Entrar</button>

      <!-- Mensagens -->
      <div class="msg error" th:if="${param.error}">
        Usuário ou senha inválidos
      </div>
      <div class="msg ok" th:if="${param.logout}">
        Sessão encerrada
      </div>
    </form>

    <div class="footer">Cortadora Laser — FAU</div>
  </main>

</body>
</html>
