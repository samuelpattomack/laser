<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Incluir suplente • Cortadora Laser — FAU</title>

  <style>
    :root{
      --primary:#e50914;
      --primary-dark:#b50710;
      --bg:#f3f4f6;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --line:#e5e7eb;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      background:#ffffff;
      border-bottom:1px solid var(--line);
      padding:12px 32px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
    }
    .logo{
      width:32px;
      height:32px;
      border-radius:999px;
      background:var(--primary);
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:800;
      box-shadow:0 10px 22px rgba(229,9,20,.3);
    }
    .nav a{
      color:var(--primary);
      font-weight:600;
      text-decoration:none;
      margin-left:16px;
      font-size:14px;
    }
    .nav a:hover{color:var(--primary-dark)}

    .wrap{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }
    .card{
      width:min(620px, 96vw);
      background:var(--card);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:26px 24px 22px;
      border:1px solid var(--line);
    }

    h1{
      margin:0 0 6px 0;
      font-size:22px;
    }
    .muted{
      margin:0 0 10px 0;
      color:var(--muted);
      font-size:14px;
    }

    label{
      display:block;
      margin:14px 0 6px;
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    input{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      font-size:15px;
      outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(229,9,20,.18);
    }

    .btn{
      margin-top:18px;
      width:100%;
      background:var(--primary);
      border-radius:999px;
      border:1px solid var(--primary);
      padding:12px 16px;
      color:#fff;
      font-weight:700;
      letter-spacing:.02em;
      cursor:pointer;
      box-shadow:0 16px 32px rgba(229,9,20,.35);
      transition:filter .15s, transform .02s, box-shadow .15s;
    }
    .btn:hover{
      filter:brightness(1.05);
      box-shadow:0 18px 36px rgba(229,9,20,.45);
    }
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.6;cursor:not-allowed;box-shadow:none;}

    .msg{
      margin-top:14px;
      font-size:14px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid;
      background:#fff;
    }
    .msg.ok{
      color:#065f46;
      border-color:#bbf7d0;
      background:#ecfdf5;
    }
    .msg.err{
      color:#991b1b;
      border-color:#fecaca;
      background:#fee2e2;
    }
    .msg.info{
      color:#374151;
      border-color:#e5e7eb;
      background:#f9fafb;
    }

    .footer{
      margin-top:18px;
      font-size:12px;
      color:var(--muted);
      text-align:right;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">M</div>
    Cortadora Laser — FAU
  </div>
  <nav class="nav">
    <a href="/app">Home</a>
    <a href="/agendar">Agendar</a>
    <a href="/cancelar">Cancelar</a>
    <a href="/suplente">Suplente</a>
    <a href="/logout">Sair</a>
  </nav>
</header>

<div class="wrap">
  <main class="card">
    <h1>Incluir Suplente</h1>
    <p class="muted"
       th:text="'Logado como ' + ${alunoNome} + ' (' + ${alunoSemestre} + 'º semestre, ' + ${alunoTipo} + ')'">
      Logado como ...
    </p>
    <p class="muted">
      Digite o ID da reserva e o e-mail do aluno que entrará como suplente.
      Apenas o titular pode incluir suplente e somente enquanto a reserva ainda não terminou.
    </p>

    <form id="form-suplente">
      <label for="reservaId">ID da reserva</label>
      <input id="reservaId" name="reservaId" type="number" min="1" required placeholder="Ex.: 4" />

      <label for="suplenteEmail">E-mail do suplente</label>
      <input id="suplenteEmail" name="suplenteEmail" type="email" required placeholder="Ex.: ciclano@fau.br" />

      <button id="btn-suplente" type="submit" class="btn">Adicionar Suplente</button>
      <div id="msg" class="msg info" style="display:none;"></div>
    </form>

    <div class="footer">Cortadora Laser — FAU</div>
  </main>
</div>

<script th:inline="none">
  const form = document.getElementById('form-suplente');
  const btn  = document.getElementById('btn-suplente');
  const msg  = document.getElementById('msg');

  function show(text, kind='info'){
    msg.className = 'msg ' + kind;
    msg.textContent = text;
    msg.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const reservaId = document.getElementById('reservaId').value.trim();
    const suplenteEmail = document.getElementById('suplenteEmail').value.trim();

    if (!reservaId){
      show('Informe o ID da reserva.','err');
      return;
    }
    if (!suplenteEmail){
      show('Informe o e-mail do suplente.','err');
      return;
    }

    btn.disabled = true;
    show('Enviando inclusão de suplente…','info');

    try{
      const params = new URLSearchParams();
      params.append('suplenteEmail', suplenteEmail);

      const res = await fetch(`/api/agendamentos/${reservaId}/suplente?` + params.toString(), {
        method: 'POST'
      });

      const text = await res.text();

      if (!res.ok){
        throw new Error(text || 'Falha ao incluir suplente.');
      }

      show(text || 'Suplente incluído com sucesso.', 'ok');
    }catch(err){
      show(err?.message || 'Erro inesperado ao incluir suplente.', 'err');
    }finally{
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
